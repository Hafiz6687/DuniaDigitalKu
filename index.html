<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySystem - Log Masuk</title>
    <!-- FontAwesome untuk ikon pengguna dan kunci -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #2c2f33; /* Warna latar belakang gelap */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 1062px; /* Dibesarkan 25% dari 850px */
            padding: 25px; /* Dibesarkan 25% dari 20px */
        }

        .login-card {
            display: flex;
            background: #ffffff;
            border-radius: 19px; /* Dibesarkan 25% dari 15px */
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        /* Bahagian Kiri (Biru 75%) */
        .left-panel {
            background: #2581f7; /* Warna biru */
            color: white;
            flex: 3; /* Menetapkan nisbah ruang 75% */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 62px 25px; /* Dibesarkan 25% */
            text-align: center;
        }

        .image-placeholder {
            width: 337px; /* Dibesarkan 50% dari 225px */
            height: 337px; /* Dibesarkan 50% dari 225px */
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px dashed #ffffff;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 31px; /* Dibesarkan 25% */
            padding: 12px;
        }

        .image-placeholder span {
            font-size: 16px; /* Dibesarkan 25% */
            color: #f1f1f1;
        }

        .left-panel h1 {
            font-size: 4.375rem; /* Dibesarkan 25% dari 3.5rem */
            margin-bottom: 6px;
            font-weight: 700;
        }

        .left-panel p {
            font-size: 1.375rem; /* Dibesarkan 25% dari 1.1rem */
            letter-spacing: 1px;
        }

        /* Bahagian Kanan (Kelabu 25%) */
        .right-panel {
            flex: 1; /* Menetapkan nisbah ruang 25% */
            background: #f2f5f8; /* Warna latar kelabu */
            padding: 75px 62px; /* Dibesarkan 25% */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .input-group {
            display: flex;
            margin-bottom: 25px; /* Dibesarkan 25% */
            border-radius: 6px;
            overflow: hidden;
            background: #ffffff; /* Ditukar kepada putih agar kontras dengan latar kelabu */
        }

        .input-group .icon {
            background: #86d4f4; /* Warna ikon biru cair */
            color: white;
            padding: 19px; /* Dibesarkan 25% */
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 69px; /* Dibesarkan 25% */
            font-size: 1.5rem; /* Dibesarkan 25% */
        }

        .input-group input {
            border: none;
            padding: 19px; /* Dibesarkan 25% */
            flex: 1;
            outline: none;
            font-size: 20px; /* Dibesarkan 25% */
            background: transparent;
        }

        .links {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap; /* Menambah fungsi wrap agar teks tidak terpotong dalam ruang 25% */
            font-size: 16px; /* Dibesarkan 25% */
            margin-bottom: 37px; /* Dibesarkan 25% */
            color: #555;
        }

        .links a {
            color: #555;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 5px;
        }

        .links a:hover {
            color: #2581f7;
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 19px; /* Dibesarkan 25% */
            background-color: #63d1ec; /* Biru cair butang */
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 20px; /* Dibesarkan 25% */
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background-color: #4ab8d3;
        }

        /* Responsif untuk skrin telefon */
        @media (max-width: 960px) {
            .login-card {
                flex-direction: column;
            }
            .right-panel {
                padding: 50px 37px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            
            <!-- Paparan Kiri -->
            <div class="left-panel">
                <div class="image-placeholder">
                    <!-- Tukar 'src' di bawah apabila gambar sebenar sudah ada -->
                    <!-- <img src="gambar-anda.png" alt="Logo" style="max-width: 100%;"> -->
                    <span>Ruangan Gambar<br>(Upload Kemudian)</span>
                </div>
                <h1>MySystem</h1>
                <p>(Dunia Digital Ku)</p>
            </div>

            <!-- Paparan Kanan -->
            <div class="right-panel">
                <form action="#" method="GET">
                    <div class="input-group">
                        <span class="icon"><i class="fa-regular fa-user"></i></span>
                        <input type="text" placeholder="ID Pengguna" required>
                    </div>
                    
                    <div class="input-group">
                        <span class="icon" style="background: #63d1ec;"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" placeholder="Kata Laluan" required>
                    </div>

                    <div class="links">
                        <a href="#"><i class="fa-solid fa-lock"></i> Lupa Kata Laluan?</a>
                        <a href="#"><i class="fa-solid fa-circle-info"></i> Pertama Kali Log Masuk</a>
                    </div>

                    <button type="submit" class="login-btn">Log Masuk</button>
                </form>
            </div>

        </div>
    </div>
</body>
</html>
