<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySystem - Log Masuk & Papan Pemuka</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #2c2f33;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 1062px;
            padding: 25px;
            display: flex;
            justify-content: center;
        }

        .login-card {
            display: flex;
            width: 100%;
            background: #ffffff;
            border-radius: 19px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .left-panel {
            background: #2581f7;
            color: white;
            flex: 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 62px 25px;
            text-align: center;
        }

        .image-placeholder {
            width: 337px;
            height: 337px;
            position: relative;
            overflow: hidden;
            border-radius: 20px; 
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); 
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 31px;
            cursor: grab;
            transition: all 0.3s ease;
        }

        .image-placeholder:active {
            cursor: grabbing;
        }

        .image-placeholder span {
            font-size: 16px;
            color: #f1f1f1;
            text-align: center;
            cursor: pointer; 
            z-index: 5; 
        }

        #preview-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; 
            transform-origin: center center;
            pointer-events: none; 
        }

        .img-action-btn {
            position: absolute;
            bottom: 15px; 
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 14px;
            cursor: pointer;
            display: none; 
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
            z-index: 10;
            opacity: 0; 
        }

        .image-placeholder:hover .img-action-btn {
            opacity: 1;
        }
        
        .img-action-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: black;
        }

        #remove-image-btn {
            left: 15px;
        }

        #reupload-btn {
            right: 55px; 
        }

        #lock-btn {
            right: 95px; 
        }

        .left-panel h1 {
            font-size: 4.5rem;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.25); 
        }

        .left-panel p {
            font-size: 1.375rem;
            letter-spacing: 1.5px;
            font-weight: 300;
            opacity: 0.9;
        }

        .right-panel {
            flex: 1;
            background: #f2f5f8;
            padding: 75px 62px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .input-group {
            display: flex;
            margin-bottom: 25px;
            border-radius: 6px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02); 
        }

        .input-group .icon {
            background: #86d4f4;
            color: white;
            padding: 19px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 69px;
            font-size: 1.5rem;
        }

        .input-group input {
            border: none;
            padding: 19px;
            flex: 1;
            outline: none;
            font-size: 20px;
            background: transparent;
        }

        .links {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            font-size: 16px;
            margin-bottom: 37px;
            color: #555;
        }

        .links a {
            color: #555;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 5px;
            transition: 0.2s;
        }

        .links a:hover {
            color: #2581f7;
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 19px;
            background-color: #63d1ec;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 15px rgba(99, 209, 236, 0.3);
        }

        .login-btn:hover {
            background-color: #4ab8d3;
            transform: translateY(-2px);
        }

        .dashboard-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            padding: 40px;
            background: #ffffff;
            border-radius: 19px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 40px;
            color: #2581f7;
        }

        .dashboard-header h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
            margin-bottom: 40px;
        }

        .dash-btn {
            background-color: #2581f7;
            color: white;
            padding: 30px 20px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 5px 15px rgba(37, 129, 247, 0.2);
        }

        .dash-btn i {
            font-size: 2.5rem;
        }

        .dash-btn:hover {
            background-color: #1a63c6;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(37, 129, 247, 0.4);
        }

        .logout-btn {
            padding: 15px 40px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background-color: #ff253a;
        }

        @media (max-width: 960px) {
            .login-card { flex-direction: column; }
            .right-panel { padding: 50px 37px; }
            .button-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .button-grid { grid-template-columns: repeat(1, 1fr); }
        }
    </style>
</head>
<body>

    <!-- LOG MASUK -->
    <div class="login-container" id="login-section">
        <div class="login-card">
            <div class="left-panel">
                <div class="image-placeholder" id="image-preview-container">
                    <span id="upload-text">Klik Sini Untuk<br>Upload Gambar</span>
                    <img id="preview-img" src="" alt="">
                    <button class="img-action-btn" id="lock-btn" title="Kunci Gambar"><i class="fa fa-unlock"></i></button>
                    <button class="img-action-btn" id="reupload-btn" title="Tukar Gambar"><i class="fa fa-camera"></i></button>
                    <button class="img-action-btn" id="remove-image-btn" title="Buang Gambar"><i class="fa fa-trash"></i></button>
                    <input type="file" id="upload-image" accept="image/*" style="display: none;">
                </div>
                <h1>MySystem</h1>
                <p>(Dunia Digital Ku)</p>
            </div>

            <div class="right-panel">
                <form id="login-form">
                    <div class="input-group">
                        <span class="icon"><i class="fa-regular fa-user"></i></span>
                        <input type="text" id="userid" placeholder="ID Pengguna" required>
                    </div>
                    
                    <div class="input-group">
                        <span class="icon" style="background: #63d1ec;"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="password" placeholder="Kata Laluan" required>
                    </div>

                    <div class="links">
                        <a href="#"><i class="fa-solid fa-lock"></i> Lupa Kata Laluan?</a>
                        <a href="#"><i class="fa-solid fa-circle-info"></i> Pertama Kali Log Masuk</a>
                    </div>

                    <button type="submit" class="login-btn">Log Masuk</button>
                </form>
            </div>
        </div>
    </div>

    <!-- PAPAN PEMUKA (DASHBOARD) -->
    <div class="dashboard-container" id="dashboard-section">
        <div class="dashboard-header">
            <h2>Selamat Datang ke MySystem</h2>
            <p>(Dunia Digital Ku) - Menu Utama</p>
        </div>

        <div class="button-grid">
            <button class="dash-btn"><i class="fa-solid fa-users"></i> Profil Pengguna</button>
            <a href="https://hafiz6687.github.io/MyKBR/" target="_blank" class="dash-btn" style="text-decoration: none;"><i class="fa-solid fa-file-invoice"></i> MyKBR</a>
            <a href="https://hafiz6687.github.io/MyKalkulator/" target="_blank" class="dash-btn" style="text-decoration: none;"><i class="fa-solid fa-calculator"></i> MyKalkulator</a>
            <a href="https://hafiz6687.github.io/MyAduan/" target="_blank" class="dash-btn" style="text-decoration: none;"><i class="fa-solid fa-envelope"></i> MyAduan</a>
            <button class="dash-btn"><i class="fa-solid fa-calendar-check"></i> Jadual</button>
            <button class="dash-btn"><i class="fa-solid fa-briefcase"></i> Pengurusan</button>
            <button class="dash-btn"><i class="fa-solid fa-gear"></i> Tetapan</button>
            <a href="https://drive.google.com/file/d/1lMAb70vJ-8V-78eyMM1_5C5latb4qe3P/view?usp=sharing" target="_blank" class="dash-btn" style="text-decoration: none;"><i class="fa-solid fa-circle-question"></i> Bantuan</a>
        </div>
        <button class="logout-btn" id="logout-btn">Log Keluar</button>
    </div>

    <!-- Masukkan Firebase Library -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-storage-compat.js"></script>

    <script>
        // --- KONFIGURASI FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCHg2YjFppm3shVrODpSG-ezR4sjOQqwvA",
            authDomain: "duniadigitalku.firebaseapp.com",
            databaseURL: "https://duniadigitalku-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "duniadigitalku",
            storageBucket: "duniadigitalku.firebasestorage.app",
            messagingSenderId: "201706892024",
            appId: "1:201706892024:web:27d67c72fa689ee291e90d"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // =========================================================
        // 1. GAMBAR PROFIL - FIREBASE STORAGE + REALTIME DATABASE
        // =========================================================

        const container = document.getElementById('image-preview-container');
        const fileInput = document.getElementById('upload-image');
        const previewImg = document.getElementById('preview-img');
        const uploadText = document.getElementById('upload-text');
        const reuploadBtn = document.getElementById('reupload-btn');
        const lockBtn = document.getElementById('lock-btn');
        const removeImageBtn = document.getElementById('remove-image-btn');

        const imageDBRef = db.ref('profil_pengguna/admin01');
        const imageStorageRef = firebase.storage().ref('profil_pengguna/admin01/gambar_profil.jpg');

        let scale = 1;
        let pointX = 0;
        let pointY = 0;
        let startX = 0;
        let startY = 0;

        let isPanning = false;
        let isLocked = false;
        let isImageLoaded = false;
        let isSavingImage = false;

        // =========================================================
        // SIMPAN STATE GAMBAR KE REALTIME DATABASE
        // =========================================================

        async function saveImageState() {
            if (!isImageLoaded || isSavingImage) return;

            isSavingImage = true;

            try {
                await imageDBRef.update({
                    scale: scale,
                    pointX: pointX,
                    pointY: pointY,
                    isLocked: isLocked,
                    updatedAt: firebase.database.ServerValue.TIMESTAMP
                });

                console.log("State gambar berjaya disimpan.");

            } catch (error) {
                console.error("Gagal menyimpan state gambar:", error);
            } finally {
                isSavingImage = false;
            }
        }

        // =========================================================
        // PAPARKAN GAMBAR
        // =========================================================

        function displayImage(imageURL, imageData = {}) {
            previewImg.onload = function () {
                isImageLoaded = true;

                previewImg.style.display = 'block';
                uploadText.style.display = 'none';

                reuploadBtn.style.display = 'flex';
                lockBtn.style.display = 'flex';
                removeImageBtn.style.display = 'flex';

                scale = typeof imageData.scale === 'number' ? imageData.scale : 1;
                pointX = typeof imageData.pointX === 'number' ? imageData.pointX : 0;
                pointY = typeof imageData.pointY === 'number' ? imageData.pointY : 0;
                isLocked = !!imageData.isLocked;

                updateLockUI();
                setTransform();
            };

            previewImg.onerror = function () {
                console.error("Gambar gagal dipaparkan.");
            };

            previewImg.src = imageURL;
        }

        // =========================================================
        // MUAT GAMBAR DARI FIREBASE
        // =========================================================

        async function loadImageFromFirebase() {
            try {
                const snapshot = await imageDBRef.once('value');

                if (!snapshot.exists()) {
                    showEmptyImage();
                    return;
                }

                const imageData = snapshot.val();

                // Format baharu: URL Firebase Storage
                if (imageData.imageURL) {
                    displayImage(imageData.imageURL, imageData);
                    return;
                }

                // Migrasi automatik gambar lama yang disimpan Base64
                if (imageData.base64 && imageData.base64.startsWith('data:image')) {
                    console.log("Memindahkan gambar lama ke Firebase Storage...");

                    const uploadResult = await imageStorageRef.putString(imageData.base64, 'data_url');
                    const imageURL = await uploadResult.ref.getDownloadURL();

                    await imageDBRef.update({
                        imageURL: imageURL,
                        scale: imageData.scale || 1,
                        pointX: imageData.pointX || 0,
                        pointY: imageData.pointY || 0,
                        isLocked: !!imageData.isLocked,
                        updatedAt: firebase.database.ServerValue.TIMESTAMP
                    });

                    displayImage(imageURL, imageData);
                    console.log("Migrasi gambar lama berjaya.");
                    return;
                }

                showEmptyImage();

            } catch (error) {
                console.error("Gagal memuatkan gambar:", error);
            }
        }

        function showEmptyImage() {
            isImageLoaded = false;

            previewImg.removeAttribute('src');
            previewImg.style.display = 'none';

            uploadText.style.display = 'block';

            reuploadBtn.style.display = 'none';
            lockBtn.style.display = 'none';
            removeImageBtn.style.display = 'none';

            scale = 1;
            pointX = 0;
            pointY = 0;
            isLocked = false;

            updateLockUI();
        }

        // =========================================================
        // UPLOAD GAMBAR - STORAGE DAHULU, DATABASE KEMUDIAN
        // =========================================================

        fileInput.addEventListener('change', async function (event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert("Sila pilih fail gambar yang sah.");
                fileInput.value = '';
                return;
            }

            try {
                const reader = new FileReader();

                reader.onload = function (e) {
                    const img = new Image();

                    img.onload = async function () {
                        try {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');

                            const MAX_WIDTH = 1200;
                            let width = img.width;
                            let height = img.height;

                            if (width > MAX_WIDTH) {
                                height = Math.round((height * MAX_WIDTH) / width);
                                width = MAX_WIDTH;
                            }

                            canvas.width = width;
                            canvas.height = height;
                            ctx.drawImage(img, 0, 0, width, height);

                            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.85);

                            // Upload ke Firebase Storage
                            const uploadResult = await imageStorageRef.putString(compressedBase64, 'data_url', {
                                contentType: 'image/jpeg'
                            });

                            // Dapatkan URL kekal gambar
                            const imageURL = await uploadResult.ref.getDownloadURL();

                            // Simpan URL dan state ke Database
                            await imageDBRef.set({
                                imageURL: imageURL,
                                scale: 1,
                                pointX: 0,
                                pointY: 0,
                                isLocked: false,
                                updatedAt: firebase.database.ServerValue.TIMESTAMP
                            });

                            scale = 1;
                            pointX = 0;
                            pointY = 0;
                            isLocked = false;

                            displayImage(imageURL);
                            console.log("Gambar berjaya disimpan secara kekal.");

                        } catch (error) {
                            console.error("Gagal upload gambar:", error);
                            alert("Gambar gagal disimpan ke Firebase.");
                        }
                    };

                    img.src = e.target.result;
                };

                reader.readAsDataURL(file);

            } catch (error) {
                console.error(error);
            }

            fileInput.value = '';
        });

        // =========================================================
        // KUNCI / BUKA KUNCI GAMBAR
        // =========================================================

        function updateLockUI() {
            if (isLocked) {
                lockBtn.innerHTML = '<i class="fa fa-lock"></i>';
                lockBtn.title = "Buka Kunci";
                reuploadBtn.style.display = 'none';
                container.style.cursor = 'default';
            } else {
                lockBtn.innerHTML = '<i class="fa fa-unlock"></i>';
                lockBtn.title = "Kunci Gambar";
                reuploadBtn.style.display = isImageLoaded ? 'flex' : 'none';
                container.style.cursor = 'grab';
            }
        }

        lockBtn.addEventListener('click', async function (e) {
            e.stopPropagation();
            if (!isImageLoaded) return;

            isLocked = !isLocked;
            updateLockUI();
            await saveImageState();
        });

        // =========================================================
        // REMOVE GAMBAR - HANYA APABILA USER PILIH
        // =========================================================

        removeImageBtn.addEventListener('click', async function (e) {
            e.stopPropagation();
            if (!isImageLoaded) return;

            const confirmRemove = confirm("Adakah anda pasti mahu membuang gambar ini secara kekal?");
            if (!confirmRemove) return;

            try {
                await imageStorageRef.delete();
                await imageDBRef.remove();
                showEmptyImage();
                console.log("Gambar telah dibuang oleh pengguna.");
            } catch (error) {
                console.error("Gagal membuang gambar:", error);
            }
        });

        // =========================================================
        // BUTANG UPLOAD / TUKAR GAMBAR
        // =========================================================

        uploadText.addEventListener('click', function () {
            fileInput.click();
        });

        reuploadBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (!isLocked) {
                fileInput.click();
            }
        });

        // =========================================================
        // ZOOM / PAN
        // =========================================================

        function setTransform() {
            previewImg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        container.addEventListener('mousedown', function (e) {
            if (!isImageLoaded || isLocked || e.target.closest('.img-action-btn')) return;

            e.preventDefault();
            isPanning = true;
            container.style.cursor = 'grabbing';
            startX = e.clientX - pointX;
            startY = e.clientY - pointY;
        });

        window.addEventListener('mousemove', function (e) {
            if (!isPanning || isLocked) return;
            pointX = e.clientX - startX;
            pointY = e.clientY - startY;
            setTransform();
        });

        window.addEventListener('mouseup', async function () {
            if (!isPanning) return;
            isPanning = false;
            if (!isLocked) {
                container.style.cursor = 'grab';
            }
            await saveImageState();
        });

        window.addEventListener('mouseleave', function () {
            isPanning = false;
        });

        container.addEventListener('wheel', function (e) {
            if (!isImageLoaded || isLocked) return;
            e.preventDefault();

            const delta = Math.sign(e.deltaY) * -1;
            scale += delta * 0.1;
            scale = Math.max(0.5, Math.min(5, scale));
            setTransform();

            clearTimeout(window.zoomTimer);
            window.zoomTimer = setTimeout(function () {
                saveImageState();
            }, 500);

        }, { passive: false });

        // =========================================================
        // LOAD GAMBAR SELEPAS SISTEM DIBUKA
        // =========================================================

        loadImageFromFirebase();

        // --- 2. FUNGSI LOG MASUK ---
        const loginForm = document.getElementById('login-form');
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');

        loginForm.addEventListener('submit', function(event) {
            event.preventDefault(); 
            const userIdInput = document.getElementById('userid').value;
            const passwordInput = document.getElementById('password').value;

            if (userIdInput === 'admin01' && passwordInput === 'Sistem@2026') {
                loginSection.style.display = 'none';
                dashboardSection.style.display = 'flex';
                loginForm.reset();
            } else {
                alert('Ralat: ID Pengguna atau Kata Laluan tidak sah. Sila cuba lagi.');
            }
        });

        // --- 3. FUNGSI LOG KELUAR ---
        const logoutBtn = document.getElementById('logout-btn');
        logoutBtn.addEventListener('click', function() {
            dashboardSection.style.display = 'none';
            loginSection.style.display = 'flex';
        });
    </script>
</body>
</html>
