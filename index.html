<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySystem - Log Masuk & Papan Pemuka</title>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #2c2f33;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* -------------------------------------
           BAHAGIAN LOG MASUK 
           ------------------------------------- */
        .login-container {
            width: 100%;
            max-width: 1062px;
            padding: 25px;
            display: flex;
            justify-content: center;
        }

        .login-card {
            display: flex;
            width: 100%;
            background: #ffffff;
            border-radius: 19px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .left-panel {
            background: #2581f7;
            color: white;
            flex: 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 62px 25px;
            text-align: center;
        }

        /* Ukuran gambar diubah kepada 500px x 500px */
        .image-placeholder {
            width: 500px;
            height: 500px;
            position: relative;
            overflow: hidden;
            border-radius: 20px; 
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); 
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 31px;
            cursor: grab;
        }

        .image-placeholder:active {
            cursor: grabbing;
        }

        .image-placeholder span {
            font-size: 16px;
            color: #f1f1f1;
            text-align: center;
            cursor: pointer; 
            z-index: 5; 
        }

        #preview-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center center;
            pointer-events: none; 
            display: none; 
        }

        .reupload-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 14px;
            cursor: pointer;
            display: none; 
            justify-content: center;
            align-items: center;
            transition: 0.3s;
            z-index: 10;
        }
        
        .reupload-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: black;
        }

        .left-panel h1 {
            font-size: 4.5rem;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.25); 
        }

        .left-panel p {
            font-size: 1.375rem;
            letter-spacing: 1.5px;
            font-weight: 300;
            opacity: 0.9;
        }

        .right-panel {
            flex: 1;
            background: #f2f5f8;
            padding: 75px 62px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .input-group {
            display: flex;
            margin-bottom: 25px;
            border-radius: 6px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02); 
        }

        .input-group .icon {
            background: #86d4f4;
            color: white;
            padding: 19px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 69px;
            font-size: 1.5rem;
        }

        .input-group input {
            border: none;
            padding: 19px;
            flex: 1;
            outline: none;
            font-size: 20px;
            background: transparent;
        }

        .links {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            font-size: 16px;
            margin-bottom: 37px;
            color: #555;
        }

        .links a {
            color: #555;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 5px;
            transition: 0.2s;
        }

        .links a:hover {
            color: #2581f7;
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 19px;
            background-color: #63d1ec;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 15px rgba(99, 209, 236, 0.3);
        }

        .login-btn:hover {
            background-color: #4ab8d3;
            transform: translateY(-2px);
        }

        /* -------------------------------------
           BAHAGIAN PAPAN PEMUKA 
           ------------------------------------- */
        .dashboard-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            padding: 40px;
            background: #ffffff;
            border-radius: 19px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 40px;
            color: #2581f7;
        }

        .dashboard-header h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
            margin-bottom: 40px;
        }

        .dash-btn {
            background-color: #2581f7;
            color: white;
            padding: 30px 20px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 5px 15px rgba(37, 129, 247, 0.2);
        }

        .dash-btn i {
            font-size: 2.5rem;
        }

        .dash-btn:hover {
            background-color: #1a63c6;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(37, 129, 247, 0.4);
        }

        .logout-btn {
            padding: 15px 40px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background-color: #ff253a;
        }

        @media (max-width: 960px) {
            .login-card { flex-direction: column; }
            .right-panel { padding: 50px 37px; }
            .button-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .button-grid { grid-template-columns: repeat(1, 1fr); }
        }
    </style>
</head>
<body>

    <!-- LOG MASUK -->
    <div class="login-container" id="login-section">
        <div class="login-card">
            
            <!-- Paparan Kiri -->
            <div class="left-panel">
                <div class="image-placeholder" id="image-preview-container">
                    <span id="upload-text">Klik Sini Untuk<br>Upload Gambar</span>
                    <img id="preview-img" src="" alt="">
                    <button class="reupload-btn" id="reupload-btn" title="Tukar Gambar"><i class="fa fa-camera"></i></button>
                    <!-- Input asal disorok -->
                    <input type="file" id="upload-image" accept="image/*" style="display: none;">
                </div>
                <h1>MySystem</h1>
                <p>(Dunia Digital Ku)</p>
            </div>

            <!-- Paparan Kanan -->
            <div class="right-panel">
                <form id="login-form">
                    <div class="input-group">
                        <span class="icon"><i class="fa-regular fa-user"></i></span>
                        <input type="text" id="userid" placeholder="ID Pengguna" required>
                    </div>
                    
                    <div class="input-group">
                        <span class="icon" style="background: #63d1ec;"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="password" placeholder="Kata Laluan" required>
                    </div>

                    <div class="links">
                        <a href="#"><i class="fa-solid fa-lock"></i> Lupa Kata Laluan?</a>
                        <a href="#"><i class="fa-solid fa-circle-info"></i> Pertama Kali Log Masuk</a>
                    </div>

                    <button type="submit" class="login-btn">Log Masuk</button>
                </form>
            </div>

        </div>
    </div>

    <!-- PAPAN PEMUKA (DASHBOARD) -->
    <div class="dashboard-container" id="dashboard-section">
        <div class="dashboard-header">
            <h2>Selamat Datang ke MySystem</h2>
            <p>(Dunia Digital Ku) - Menu Utama</p>
        </div>

        <div class="button-grid">
            <button class="dash-btn"><i class="fa-solid fa-users"></i> Profil Pengguna</button>
            <button class="dash-btn"><i class="fa-solid fa-file-invoice"></i> Dokumen</button>
            <button class="dash-btn"><i class="fa-solid fa-chart-line"></i> Laporan</button>
            <button class="dash-btn"><i class="fa-solid fa-envelope"></i> Mesej</button>
            <button class="dash-btn"><i class="fa-solid fa-calendar-check"></i> Jadual</button>
            <button class="dash-btn"><i class="fa-solid fa-briefcase"></i> Pengurusan</button>
            <button class="dash-btn"><i class="fa-solid fa-gear"></i> Tetapan</button>
            <button class="dash-btn"><i class="fa-solid fa-circle-question"></i> Bantuan</button>
        </div>
        <button class="logout-btn" id="logout-btn">Log Keluar</button>
    </div>

    <script>
        // --- 1. FUNGSI GAMBAR (UPLOAD, LOCALSTORAGE, PAN/DRAG, ZOOM) ---
        const container = document.getElementById('image-preview-container');
        const fileInput = document.getElementById('upload-image');
        const previewImg = document.getElementById('preview-img');
        const uploadText = document.getElementById('upload-text');
        const reuploadBtn = document.getElementById('reupload-btn');

        let scale = 1, pointX = 0, pointY = 0, startX = 0, startY = 0, isPanning = false;

        window.addEventListener('DOMContentLoaded', () => {
            const savedImage = localStorage.getItem('mysystem_profile_image');
            if (savedImage) {
                previewImg.src = savedImage;
                previewImg.style.display = 'block';
                uploadText.style.display = 'none';
                reuploadBtn.style.display = 'flex';
                setTransform();
            }
        });

        uploadText.addEventListener('click', () => {
            fileInput.click();
        });

        reuploadBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.click();
        });

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Data = e.target.result;
                    previewImg.src = base64Data;
                    previewImg.style.display = 'block';
                    uploadText.style.display = 'none';
                    reuploadBtn.style.display = 'flex'; 
                    
                    localStorage.setItem('mysystem_profile_image', base64Data);
                    
                    scale = 1; pointX = 0; pointY = 0;
                    setTransform();
                }
                reader.readAsDataURL(file);
            }
        });

        function setTransform() {
            previewImg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        container.addEventListener('mousedown', function(e) {
            if(previewImg.style.display === 'none' || e.target === reuploadBtn || e.target === uploadText) return;
            e.preventDefault();
            isPanning = true;
            startX = e.clientX - pointX;
            startY = e.clientY - pointY;
        });

        window.addEventListener('mousemove', function(e) {
            if (!isPanning) return;
            pointX = e.clientX - startX;
            pointY = e.clientY - startY;
            setTransform();
        });

        window.addEventListener('mouseup', function() {
            if (isPanning) isPanning = false;
        });

        window.addEventListener('mouseleave', function() {
            if (isPanning) isPanning = false;
        });

        container.addEventListener('wheel', function(e) {
            if(previewImg.style.display === 'none') return;
            e.preventDefault();
            const delta = Math.sign(e.deltaY) * -1;
            const zoomSpeed = 0.1;
            let newScale = scale + (delta * zoomSpeed);
            if (newScale < 0.5) newScale = 0.5; 
            if (newScale > 5) newScale = 5;     
            scale = newScale;
            setTransform();
        }, { passive: false }); 


        // --- 2. FUNGSI LOG MASUK ---
        const loginForm = document.getElementById('login-form');
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');

        loginForm.addEventListener('submit', function(event) {
            event.preventDefault(); 
            const userIdInput = document.getElementById('userid').value;
            const passwordInput = document.getElementById('password').value;

            // ID: admin01 | Pass: Sistem@2026
            if (userIdInput === 'admin01' && passwordInput === 'Sistem@2026') {
                loginSection.style.display = 'none';
                dashboardSection.style.display = 'flex';
                loginForm.reset();
            } else {
                alert('Ralat: ID Pengguna atau Kata Laluan tidak sah. Sila cuba lagi.');
            }
        });

        // --- 3. FUNGSI LOG KELUAR ---
        const logoutBtn = document.getElementById('logout-btn');
        logoutBtn.addEventListener('click', function() {
            dashboardSection.style.display = 'none';
            loginSection.style.display = 'flex';
        });
    </script>
</body>
</html>
